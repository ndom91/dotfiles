# set  -g default-terminal "screen"
# start panes at 1 - 0 is too far away :)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# basic settings
set-window-option -g xterm-keys on # for vim
set-window-option -g monitor-activity on
set -g history-limit 30000
set -ga terminal-features "*:hyperlinks"

new-session

# use vim motion keys while in copy mode
setw -g mode-keys vi
set -g status-keys vi

# rebind main key: C-a
unbind C-b
set -g prefix C-a
# bind -N "Send the prefix key through to the application" C-a send-prefix

# use mouse # More on mouse support http://floriancrouzat.net/2010/07/run-tmux-with-mouse-support-in-mac-os-x-terminal-app/
set  -g mouse             on
setw -g aggressive-resize on
setw -g clock-mode-style  24
set  -s escape-time       10
set  -g history-limit     10000

set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

# ============== Plugins ================ #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'Ataraxy-Labs/opensessions'

# tmux-ai-window-name
set -g @plugin 'ndom91/tmux-ai-window-name'
set -g @ai_window_name_mode 'local'
set -g @ai_window_name_local_url 'https://llama-dash.puff.lan/v1/chat/completions'
source-file -q ~/.config/tmux/secrets.conf
set -g @ai_window_name_local_model 'gemma-4-26B-A4B-it'
set -g @ai_window_name_debug 'off'

# tmuxplugin-rose-pine
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_date_time "%d.%m. %H:%M"
set -g @rose_pine_directory 'off'
# set -g @rose_pine_bar_bg_disabled_color_option 'default'
# set -g @rose_pine_status_right_append_section '#{tmux_mode_indicator}'
# set -g @rose_pine_default_window_behavior 'on'

set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'on'

set -g @rose_pine_left_separator ":"
set -g @rose_pine_right_separator " "
set -g @rose_pine_window_status_separator " | "

# tmuxplugin-mode-indicator
# ---------------------
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# tmuxplugin-tmux-thumbs
# ---------------------
set -g @plugin 'fcsonline/tmux-thumbs'
# run-shell $HOME/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | wl-copy'

# ============================================= #

# Setup 'v' to begin selection as in Vim
bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down
unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace xclip"
unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi [         ;   bind-key -T copy-mode-vi [ send-keys -X begin-selection
unbind-key -T copy-mode-vi ]         ;   bind-key -T copy-mode-vi ] send-keys -X copy-selection

# for nested tmux sessions
set -g prefix C-a
bind-key a send-prefix

# Undercurl
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# FZF-TMUX WINDOW SWITCH
# bind-key    -T prefix s                choose-tree
# bind-key    -T prefix W                choose-window
# bind        -T prefix w                run-shell -b "$HOME/.dotfiles/scripts/tmux-switch-panes.sh"

# Titles (window number, program name, active (or not))
set-option -g set-titles on
set-option -g set-titles-string '#H #W'

# Unbinds
unbind j
unbind C-b # unbind default leader key
unbind '"' # unbind horizontal split
unbind %   # unbind vertical split
unbind d   # unbind vertical split

# Sesh
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"

unbind s
bind-key s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^x tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-x:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:50%' \
    --preview '~/.config/tmux/scripts/sesh-preview.sh {}'
)\""

# reload tmux conf
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# new split in current pane (horizontal / vertical)
bind-key c split-window -v # split pane horizontally
bind-key v split-window -h # split pane vertically

# windows
unbind w
bind-key w run-shell "~/.config/tmux/scripts/tmux-window-picker.sh"
bind-key m new-window
bind C-p previous-window
bind C-n next-window
bind-key C-a switch-client -l # C-a C-a for last active session
bind A command-prompt "rename-window %%"

# use the vim motion keys to move between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resizing
bind-key C-h resize-pane -L 5
bind-key C-j resize-pane -D 5
bind-key C-k resize-pane -U 5
bind-key C-l resize-pane -R 5

# layouts
bind o select-layout 4582,187x95,0,0[187x69,0,0,0,187x25,0,70,23]
bind C-r rotate-window

# coding agents
set -g extended-keys on
set -g extended-keys-format csi-u

# Zoom indicator - prepend "Z" to status-right when pane is zoomed
set -ga status-right "#{?window_zoomed_flag, Z,}"

run "/Users/ndom91/.config/tmux/plugins/tpm/tpm"
